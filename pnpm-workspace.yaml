packages:
  - packages/*
  - examples/*

# Single source of truth for the SignalX core version. Every package references
# these as "catalog:", which pnpm rewrites to the range below on pack/publish.
# Keep core single-minor (^X.Y.0) — two @sigx/reactivity copies break reactivity.
catalog:
  '@sigx/reactivity': ^0.15.2
  '@sigx/runtime-core': ^0.15.2
  '@sigx/vite': ^0.15.2

onlyBuiltDependencies:
  - esbuild
